    <script>
      // Dev-only: aggressively unregister old service workers to prevent cached /src/* imports
      (function () {
        if (!('serviceWorker' in navigator)) return;
        const isDevHost = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.port === '3000' || location.hostname.includes('3000-');
        if (!isDevHost) return;
        const FLAG = 'sw-dev-preclean';
        if (sessionStorage.getItem(FLAG)) return;
        sessionStorage.setItem(FLAG, 'true');
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => Promise.all(registrations.map((reg) => reg.unregister())))
          .then(() => ('caches' in window ? caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k)))) : null))
          .then(() => {
            if (navigator.serviceWorker.controller) {
              location.reload();
            }
          })
          .catch((err) => console.warn('SW dev pre-clean failed', err));
      })();
    </script>
