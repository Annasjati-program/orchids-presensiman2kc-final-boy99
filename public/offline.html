<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - EduShift</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
    }

    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 2rem;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    p {
      font-size: 1.1rem;
      opacity: 0.9;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .features {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 2rem;
      backdrop-filter: blur(10px);
    }

    .feature-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin: 0.75rem 0;
      font-size: 0.95rem;
    }

    .checkmark {
      color: #4ade80;
      font-weight: bold;
    }

    .retry-btn {
      background: white;
      color: #667eea;
      border: none;
      padding: 12px 32px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 1rem;
    }

    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .retry-btn:active {
      transform: translateY(0);
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .status {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      margin-top: 1rem;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Mode Offline</h1>
    <p>Tidak ada koneksi internet. Aplikasi sedang berjalan dalam mode offline.</p>
    
    <div class="features">
      <div class="feature-item">
        <span class="checkmark">✓</span>
        <span>Data tersimpan lokal di perangkat</span>
      </div>
      <div class="feature-item">
        <span class="checkmark">✓</span>
        <span>Otomatis sync saat online kembali</span>
      </div>
      <div class="feature-item">
        <span class="checkmark">✓</span>
        <span>Fitur offline tetap berjalan</span>
      </div>
    </div>

    <button class="retry-btn" onclick="location.reload()">
      🔄 Coba Lagi
    </button>

    <div class="status" id="status">Menunggu koneksi...</div>
  </div>

  <script>
    window.addEventListener('online', () => {
      document.getElementById('status').textContent = '✓ Terhubung! Memuat ulang...';
      setTimeout(() => location.reload(), 1000);
    });

    window.addEventListener('offline', () => {
      document.getElementById('status').textContent = 'Menunggu koneksi...';
    });

    if (navigator.onLine) {
      document.getElementById('status').textContent = '✓ Terhubung! Memuat ulang...';
      setTimeout(() => location.reload(), 1000);
    }
  </script>
</body>
</html>
